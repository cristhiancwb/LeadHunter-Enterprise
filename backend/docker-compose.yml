services:

  postgres:

    image: postgres:17

    container_name: leadhunter-postgres

    restart: unless-stopped

    environment:

      POSTGRES_DB: leadhunter

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: postgres

    ports:

      - "5432:5432"

    volumes:

      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:

    image: redis:8-alpine

    container_name: leadhunter-redis

    restart: unless-stopped

    ports:

      - "6379:6379"

    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:

    build:

      context: ./backend

    container_name: leadhunter-api

    restart: unless-stopped

    ports:

      - "8000:8000"

    env_file:

      - .env.example

    depends_on:

      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    volumes:

      - ./backend:/app

volumes:

  postgres_data: